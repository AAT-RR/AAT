<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif">
<rect width="1000" height="540" fill="#ffffff"/>
<text x="500" y="28" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="500" dy="0">Mic position check: why only the line-of-sight error is visible (schematic)</tspan></text>
