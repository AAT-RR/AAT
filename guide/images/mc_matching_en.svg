<line x1="266.527" y1="60" x2="266.527" y2="380" stroke="#f1f5f9" stroke-width="1"/>
<text x="266.527" y="398" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal"><tspan x="266.527" dy="0">500</tspan></text>
