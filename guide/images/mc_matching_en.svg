<text x="407.628" y="398" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal"><tspan x="407.628" dy="0">2k</tspan></text>
<line x1="500.892" y1="60" x2="500.892" y2="380" stroke="#f1f5f9" stroke-width="1"/>
<text x="500.892" y="398" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal"><tspan x="500.892" dy="0">5k</tspan></text>
<line x1="571.443" y1="60" x2="571.443" y2="380" stroke="#f1f5f9" stroke-width="1"/>
<text x="571.443" y="398" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal"><tspan x="571.443" dy="0">10k</tspan></text>
<text x="335" y="420" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal"><tspan x="335" dy="0">Frequency (Hz)</tspan></text>
<text x="26" y="220" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" transform="rotate(-90 26 220.0)"><tspan x="26" dy="0">Deviation from the median (dB)</tspan></text>
