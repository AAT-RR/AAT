<circle cx="120" cy="141.556" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="120" y="146.556" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="120" dy="0">1</tspan></text>
<circle cx="120" cy="255.333" r="11" fill="#ea580c" stroke="#ea580c" stroke-width="1"/>
<text x="120" y="260.333" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="120" dy="0">2</tspan></text>
<circle cx="360.601" cy="357.556" r="11" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="360.601" y="362.556" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="360.601" dy="0">3</tspan></text>
<circle cx="620" cy="80" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="620" y="85" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="620" dy="0">1</tspan></text>
<text x="640" y="85" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="640" dy="0">A line on 0 dB = like the others</tspan><tspan x="640" dy="1.3em">(normal)</tspan></text>
<circle cx="620" cy="150" r="11" fill="#ea580c" stroke="#ea580c" stroke-width="1"/>
<text x="620" y="155" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="620" dy="0">2</tspan></text>
<text x="640" y="155" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="640" dy="0">The whole line shifted (-6 dB here)</tspan><tspan x="640" dy="1.3em">= Sensitivity dev</tspan><tspan x="640" dy="1.3em">(different gain or mic sensitivity)</tspan></text>
<circle cx="620" cy="238" r="11" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="620" y="243" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold"><tspan x="620" dy="0">3</tspan></text>
<text x="640" y="243" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="640" dy="0">A bent line with a dip at some frequency</tspan><tspan x="640" dy="1.3em">= Shape dev</tspan><tspan x="640" dy="1.3em">(different frequency response:</tspan><tspan x="640" dy="1.3em">blocked port, leak, resonance)</tspan></text>
<rect x="608" y="330" width="290" height="112" rx="6" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2" opacity="1"/>
<text x="620" y="352" font-size="13" fill="#1f2937" text-anchor="start" font-weight="bold"><tspan x="620" dy="0">Numbers in the table:</tspan></text>
<text x="620" y="372" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"><tspan x="620" dy="0">Sensitivity dev = mean offset of the line</tspan><tspan x="620" dy="1.3em">Shape dev = what is left after removing it (rms)</tspan><tspan x="620" dy="1.3em">Total dev = both together; the table is sorted by</tspan><tspan x="620" dy="1.3em">it (largest on top = worst match)</tspan></text>
<text x="500" y="452" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal"><tspan x="500" dy="0">Note: levels are relative; the channels must be recorded with the same gain to be comparable. Hover a data point to see the deviation of that band.</tspan></text>
</svg>
