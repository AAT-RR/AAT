<circle cx="361.399" cy="326.566" r="2.6" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<circle cx="384.916" cy="255.663" r="2.6" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<circle cx="408.433" cy="183.197" r="2.6" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<circle cx="431.95" cy="167.555" r="2.6" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<circle cx="455.467" cy="162.691" r="2.6" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<circle cx="478.984" cy="137.474" r="2.6" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<circle cx="502.501" cy="113.506" r="2.6" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
