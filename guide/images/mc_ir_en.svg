<text x="450" y="408" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal"><tspan x="450" dy="0">C50 = 10*log10( early energy / late energy ) dB, higher = clearer.   D50 = early energy / total energy x 100 %, higher = clearer.</tspan></text>
