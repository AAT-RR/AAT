<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif">
<rect width="900" height="520" fill="#ffffff"/>
<text x="450" y="28" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold"><tspan x="450" dy="0">Locate the speaker: finding the speaker from the delays (schematic)</tspan></text>
